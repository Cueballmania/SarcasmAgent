name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: sarcasm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d sarcasm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test-only-password@localhost:5432/sarcasm_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
      - run: uv sync --locked --group eval --group browser
      - run: uv run --locked --group browser playwright install --with-deps chromium
      - run: uv lock --check
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - name: Required offline and isolated PostgreSQL tests
        run: uv run --locked --group eval --group browser pytest -q
      - name: Verify production-only locked installation
        run: uv sync --locked --no-dev
